<!-- ============ 3D GLAZING ============ -->
<section class="sec sec--dark" id="termopan">
  <div class="wrap">
    <div class="sec-head reveal">
      <span class="kicker" data-i18n="t3d.kicker"></span>
      <h2 class="h-sec" data-i18n="t3d.title"></h2>
      <p class="sub-sec" data-i18n="t3d.sub"></p>
    </div>

    <div class="glaze">
      <div class="reveal">
        <div class="glaze__stage">
          <canvas id="glaze-canvas"></canvas>
          <!-- The camera views the unit from the room, so the indoor face is on the left. -->
          <span class="glaze__side glaze__side--out" data-i18n="t3d.inside"></span>
          <span class="glaze__side glaze__side--in" data-i18n="t3d.outside"></span>
          <div class="glaze__hint" id="glazeHint"><svg aria-hidden="true"><use href="#i-drag"/></svg><span data-i18n="t3d.hint"></span></div>
          <div class="glaze__loading" id="glazeLoading"><i></i></div>
        </div>

        <div class="glaze__ctrls">
          <div class="seg" role="group" aria-label="Layers">
            <button type="button" data-panes="2" aria-pressed="false" data-i18n="t3d.ctrl.double"></button>
            <button type="button" data-panes="3" aria-pressed="true" data-i18n="t3d.ctrl.triple"></button>
          </div>
          <div class="seg" role="group" aria-label="Flow">
            <button type="button" data-flow="none" aria-pressed="false" data-i18n="t3d.ctrl.none"></button>
            <button type="button" data-flow="heat" aria-pressed="true" data-i18n="t3d.ctrl.heat"></button>
            <button type="button" data-flow="sound" aria-pressed="false" data-i18n="t3d.ctrl.sound"></button>
          </div>
          <label class="toggle"><input type="checkbox" id="explodeToggle"><span class="track"></span><span data-i18n="t3d.ctrl.explode"></span></label>
          <label class="toggle"><input type="checkbox" id="spinToggle" checked><span class="track"></span><span data-i18n="t3d.ctrl.rotate"></span></label>
        </div>
      </div>

      <div class="reveal reveal-d2">
        <div class="layers" id="layerList">
          <button class="layer is-active" type="button" data-layer="0"><span class="layer__n">1</span><span><span class="layer__t" data-i18n="t3d.p1.t"></span><span class="layer__d" data-i18n="t3d.p1.d"></span></span></button>
          <button class="layer" type="button" data-layer="1"><span class="layer__n">2</span><span><span class="layer__t" data-i18n="t3d.p2.t"></span><span class="layer__d" data-i18n="t3d.p2.d"></span></span></button>
          <button class="layer" type="button" data-layer="2"><span class="layer__n">3</span><span><span class="layer__t" data-i18n="t3d.p3.t"></span><span class="layer__d" data-i18n="t3d.p3.d"></span></span></button>
          <button class="layer" type="button" data-layer="3" data-tripleonly><span class="layer__n">4</span><span><span class="layer__t" data-i18n="t3d.p4.t"></span><span class="layer__d" data-i18n="t3d.p4.d"></span></span></button>
